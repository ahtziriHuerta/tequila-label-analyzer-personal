<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Herramienta de apoyo para revisar el etiquetado de tequila conforme a la NOM-006-SCFI-2012.">
  <meta name="theme-color" content="#0b4a6f">
  <title>Analizador de Etiquetado de Tequila</title>
  <link rel="icon" href="img/icono.svg" type="image/svg+xml">
  <!-- PWA: instalable en el celular (manifest + service worker registrado en js/app.js) -->
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="img/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Etiquetado">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body data-sesion="verificando">
  <!-- Iconos (se usan con <svg><use href="#i-nombre"/></svg>) -->
  <svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" style="position:absolute;width:0;height:0;overflow:hidden">
    <symbol id="i-agave" viewBox="0 0 24 24"><path d="M12 3c-1.5 3-4.5 4.5-4.5 9a4.5 4.5 0 0 0 9 0C16.5 7.5 13.5 6 12 3z"/><path d="M12 21v-4"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="i-minus" viewBox="0 0 24 24"><path d="M5 12h14"/></symbol>
    <symbol id="i-home" viewBox="0 0 24 24"><path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/></symbol>
    <symbol id="i-camera" viewBox="0 0 24 24"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></symbol>
    <symbol id="i-download" viewBox="0 0 24 24"><path d="M12 4v12M7 11l5 5 5-5"/><path d="M4 20h16"/></symbol>

    <symbol id="i-check" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></symbol>
    <symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></symbol>

    <symbol id="i-blur" viewBox="0 0 24 24"><path d="M12 4a8 8 0 1 0 0 16"/><path d="M15 6h.01M17.5 9h.01M18.5 12h.01M17.5 15h.01M15 18h.01" stroke-width="2.6"/></symbol>
    <symbol id="i-image-add" viewBox="0 0 24 24"><rect x="3" y="5" width="13" height="14" rx="2"/><path d="M3 15l4-4 4 4 2-2 3 3"/><path d="M19 4v6M16 7h6"/></symbol>
    <symbol id="i-user-check" viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.5"/><path d="M3 20c0-3.5 2.7-6 6-6s6 2.5 6 6"/><path d="M15.5 11.5l2 2 4-4"/></symbol>

  <a class="skip-link" href="#vista">Saltar al contenido</a>

  <header class="topbar">
    <div class="topbar__inner">
      <a class="brand" href="#/" aria-label="Inicio">
        <span class="brand__logo"><svg class="icon"><use href="#i-agave"/></svg></span>
        <span class="brand__text">
          <strong>Analizador de Etiquetado</strong>
          <small>Tequila · NOM-006-SCFI-2012</small>
        </span>
      </a>
      <nav class="topnav" aria-label="Principal">
        <a href="#/" data-ruta="inicio"><svg class="icon"><use href="#i-home"/></svg><span>Inicio</span></a>
        <a href="#/nuevo" data-ruta="nuevo"><svg class="icon"><use href="#i-plus"/></svg><span>Nuevo análisis</span></a>
        <a href="#/historial" data-ruta="historial"><svg class="icon"><use href="#i-history"/></svg><span>Historial</span></a>
        <a href="#/configuracion" data-ruta="config"><svg class="icon"><use href="#i-settings"/></svg><span>Configuración</span></a>
      </nav>
      <button type="button" id="instalar" class="api-pill api-pill--boton" hidden>
        <svg class="icon"><use href="#i-download"/></svg><span>Instalar app</span>
      </button>
      <span id="estado-api" class="api-pill" data-estado="verificando" role="status">
        <span class="api-pill__dot"></span><span class="api-pill__txt">Verificando API…</span>
      </span>
      <div id="menu-usuario" class="menu-usuario" hidden></div>
    </div>
  </header>

  <main id="vista" class="contenedor" tabindex="-1"></main>

  <footer class="pie">
    <div class="contenedor">
      <p><strong>Herramienta de apoyo.</strong> Los resultados no sustituyen una certificación oficial ni un dictamen del organismo evaluador.</p>
    </div>
  </footer>

  <div id="toasts" class="toasts" aria-live="polite"></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
